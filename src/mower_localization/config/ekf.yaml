ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    # Ramki zsynchronizowane z diff_drive_controller:
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # 1. Odometria z kół (z kontrolera)
    odom0: /diff_drive_controller/odom
    odom0_config: [
      false, false, false,
      false, false, false, # Ignoruj absolutny yaw (unikamy błędu poślizgu)
      true,  true, false, # Ufaj prędkości liniowej VX (jazda prosto)
      false, false, false,  # Ufaj prędkości obrotowej VYAW z kół (pomocniczo)
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false

    # 2. Żyroskop z IMU
    imu0: /imu/data_raw
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,  # Ufaj żyroskopowi w osi Z (klucz do precyzyjnego 90 st.)
      false, false, false
    ]
    imu0_differential: false
    imu0_relative: false